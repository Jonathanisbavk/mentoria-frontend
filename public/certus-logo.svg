<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" fill="none">
  <!-- Outer pill - Certus navy -->
  <rect width="420" height="130" rx="65" fill="#0B2272"/>
  <!-- Inner pill - white, inset -->
  <rect x="9" y="9" width="402" height="112" rx="56" fill="white"/>
  <!-- CERTUS text - Certus navy, bold rounded -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="'Montserrat','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif"
    font-size="64"
    font-weight="800"
    fill="#0B2272"
    letter-spacing="4"
  >CERTUS</text>
</svg>
